<!-- container where documents will be displayed -->
    <div id="viewerContainer" style="display: none;">
    <h3>Viewing Document:</h3>
    <iframe id="pdfViewer" src="" class="pdf-container"></iframe>
</div>

    
    <script>
        const selector = document.getElementById('student-select');
        const viewerContainer = document.getElementById('viewerContainer');
        const pdfViewer = document.getElementById('pdfViewer');

        // Listen for when the user picks a new option
        selector.addEventListener('change', function() {
            const selectedPdfUrl = this.value;

            if (selectedPdfUrl) {
                // Update the PDF source path and reveal the container
                pdfViewer.src = selectedPdfUrl;
                viewerContainer.style.display = 'block';
            } else {
                // Hide the container if they pick the default empty option
                viewerContainer.style.display = 'none';
                pdfViewer.src = '';
            }
        });
    </script>
